name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          secedit /export /cfg local.cfg
          (Get-Content local.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content local.cfg
          secedit /configure /db secedit.sdb /cfg local.cfg /areas SECURITYPOLICY

          net user RDP TechZonerRDP2026 /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i tailscale.msi /quiet /norestart" -Wait
          Remove-Item "tailscale.msi" -Force

      - name: Establish Tailscale Connection
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=\${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-win11
          Start-Sleep -Seconds 10

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Username: RDP"
          Write-Host "Password: TechZonerRDP2026"
          Write-Host "==================`n"

          while (\$true) {
              if (Test-Path "C:\Users\RDP") {
                  if (-not (Test-Path "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup")) {
                      New-Item -ItemType Directory -Path "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup" -Force | Out-Null
                  }
                  Invoke-WebRequest -Uri "https://gitlab.com" -OutFile "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\Downloads.bat" -UseBasicParsing
                  Write-Host "✅ Downloads.bat copied successfully."
                  break
              }
              else {
                  Write-Host "[\$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 20
              }
          }

          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Runner is running..."
              Start-Sleep -Seconds 300
          }
