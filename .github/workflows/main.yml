
name: Win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Create or Reset RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add a non-empty RDP_PASSWORD secret in GitHub repository settings."
          }

          $username = "RDP"
          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser `
              -Name $username `
              -Password $securePass
          }

          Enable-LocalUser -Name $username

          $user = Get-LocalUser -Name $username
          if (-not $user.Enabled) {
            throw "RDP user is not enabled."
          }

          $groups = @(
            "Remote Desktop Users"
          )

          foreach ($group in $groups) {
            $members = Get-LocalGroupMember `
              -Group $group -ErrorAction SilentlyContinue

            if (-not ($members | Where-Object {
              $_.Name -match '\\RDP$'
            })) {
              Add-LocalGroupMember -Group $group -Member $username
            }
          }

          Write-Host "RDP account configured successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = "$env:TEMP\tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "Configure the TAILSCALE_AUTHKEY GitHub secret."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable was not found."
          }

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $tsIP = (& $ts ip -4 | Select-Object -First 1).Trim()

            if ($tsIP -match '^\d{1,3}(\.\d{1,3}){3}$') {
              break
            }

            $tsIP = $null
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned successfully."

      - name: Verify RDP Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name TermService
          if ($service.Status -ne "Running") {
            Start-Service -Name TermService
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP listener is active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows runner is active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: configured using GitHub Secrets."
          Write-Host "Do not print passwords in workflow logs."

          while ($true) {
            Write-Host "[$(Get-Date)] Runner is active."
            Start-Sleep -Seconds 300
          }
