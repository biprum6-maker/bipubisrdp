name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          net stop TermService /y
          net start TermService /y

      - name: Create RDP User with Fixed Password
        shell: cmd
        run: |
          secedit /export /cfg local.cfg
          powershell -Command "(Get-Content local.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content local.cfg"
          secedit /configure /db secedit.sdb /cfg local.cfg /areas SECURITYPOLICY
          net user RDP TechZonerRDP2026 /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add

      - name: Install Tailscale
        shell: cmd
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://tailscale.com' -OutFile '%TEMP%\tailscale.msi'"
          msiexec.exe /i "%TEMP%\tailscale.msi" /quiet /norestart
          timeout /t 5 /nobreak

      - name: Establish Tailscale Connection
        shell: cmd
        run: |
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-win11
          timeout /t 10 /nobreak

      - name: Maintain Connection + Watch RDP User
        shell: cmd
        run: |
          echo === RDP ACCESS ===
          "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo Username: RDP
          echo Password: TechZonerRDP2026
          echo ==================
          
          :loop
          if exist C:\Users\RDP (
              if not exist "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup" mkdir "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
              powershell -Command "Invoke-WebRequest -Uri 'https://gitlab.com' -OutFile 'C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\Downloads.bat' -UseBasicParsing"
              echo Downloads.bat copied successfully.
              goto keepalive
          ) else (
              echo Waiting for RDP profile to be created...
              timeout /t 30 /nobreak
              goto loop
          )

          :keepalive
          echo RDP Active - Runner is running...
          timeout /t 300 /nobreak
          goto keepalive
